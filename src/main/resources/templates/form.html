<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Formulario de Curso')"></head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0" th:text="${curso.id != null} ? 'Editar curso' : 'Nuevo curso'"></h4>
                </div>
                <div class="card-body">
                    <div th:object="${curso}" th:remove="tag">
                        <ul th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                        <form th:action="@{/form}" th:object="${curso}" method="post">
                            <input type="hidden" th:field="*{id}"/>
                            <div class="mb-3">
                                <label for="codigo" class="form-label">Código</label>
                                <input id="codigo" type="text" class="form-control" th:field="*{codigo}" placeholder="Ej. INF-101"/>
                                <small class="form-text text-danger" th:if="${#fields.hasErrors('codigo')}"
                                       th:errors="*{codigo}"></small>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input id="nombre" type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre del curso"/>
                                <small class="form-text text-danger" th:if="${#fields.hasErrors('nombre')}"
                                       th:errors="*{nombre}"></small>
                            </div>
                            <div class="mb-3">
                                <label for="creditos" class="form-label">Créditos</label>
                                <input id="creditos" type="number" min="0" max="5" class="form-control" th:field="*{creditos}"/>
                                <small class="form-text text-danger" th:if="${#fields.hasErrors('creditos')}"
                                       th:errors="*{creditos}"></small>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a class="btn btn-secondary" th:href="@{/listar}">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="fragments/header :: scripts"></div>
</body>
</html>
